name: CI

# Unit tests, a type check of the package, a reading-mode build of the demo
# (its postbuild runs check-dist, which also fails on any CMS byte in the
# output), and the two content check CLIs over the demo's notes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Guard: the canonical repo runs CI; a mirror absorbing this tree does not.
    if: github.repository == 'ventusff/astro-inkbrush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            demo/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Install, type-check and build the demo (reading mode)
        working-directory: demo
        run: |
          npm ci --no-audit --no-fund
          npx astro check
          npm run build
      - name: Check the demo's notes
        working-directory: demo
        run: |
          node ../scripts/check-content.mjs src/content/notes --math
          node ../scripts/check-wikilinks.mjs src/content/notes --locale-prefix zh/ --strict --allow compost-heap
