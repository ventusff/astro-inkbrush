name: CI

# Unit tests and a type check of the package. The integration build — an
# Astro site consuming the engine, its output checked for CMS bytes, its
# notes run through the content CLIs — lives in the astro-inkstone
# repository, whose demo garden vendors this engine.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Guard: the canonical repo runs CI; a mirror absorbing this tree does not.
    if: github.repository == 'ventusff/astro-inkbrush'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
