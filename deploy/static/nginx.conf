server {
    listen 80;
    # alpine's wget resolves `localhost` to ::1: the health probe needs the
    # IPv6 listener as well
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Astro builds with trailingSlash:'ignore' and emits <page>/index.html
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Astro's hashed assets are immutable per build; everything else revalidates
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # a health probe independent of any page's content
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
